plugins {
    id 'java'
    id 'io.qameta.allure' version '2.11.2'
}

group = 'org.example'
version = '1.0-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

compileJava.options.encoding = 'UTF-8'
compileTestJava.options.encoding = 'UTF-8'

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.seleniumhq.selenium:selenium-java:4.27.0'

    testImplementation 'org.testng:testng:7.10.2'
    testImplementation 'io.qameta.allure:allure-testng:2.30.0'
    testImplementation 'org.aspectj:aspectjweaver:1.9.22'
}

tasks.named('copyCategories') {
    enabled = false
}

test {
    useTestNG {
        suites 'src/test/resources/testng.xml'
    }

    systemProperty 'headless',
            System.getProperty('headless', 'false')

    systemProperty 'screenshot.events',
            System.getProperty('screenshot.events', 'failed,skipped')

    systemProperty 'java.util.logging.SimpleFormatter.format',
            '%1$tF %1$tT [%4$s] %3$s - %5$s%6$s%n'

    systemProperty 'allure.results.directory',
            layout.buildDirectory.dir('allure-results').get().asFile.absolutePath

    testLogging {
        events 'passed', 'skipped', 'failed'
        showStandardStreams = true
    }
}

allure {
    version = '2.30.0'
    autoconfigure = true
    aspectjweaver = true

    report {
        reportDir.set(layout.buildDirectory.dir('reports/allure-report'))
    }
}
tasks.register('copyAllureHistory', Copy) {
    from(layout.buildDirectory.dir('reports/allure-report/allureReport/history')) {
        include '**/*.json'
    }
    into(layout.buildDirectory.dir('allure-results/history'))
    onlyIf {
        layout.buildDirectory.dir('reports/allure-report/allureReport/history')
                .get().asFile.exists()
    }
}

tasks.named('allureServe') {
    dependsOn 'copyAllureHistory'
}

tasks.named('allureReport') {
    finalizedBy 'copyAllureHistory'
}