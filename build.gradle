plugins {
    id 'java'
    id 'io.qameta.allure' version '2.11.2'
}

group = 'org.example'
version = '1.0-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

compileJava.options.encoding = "UTF-8"
compileTestJava.options.encoding = "UTF-8"

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.seleniumhq.selenium:selenium-java:4.27.0'

    testImplementation 'org.testng:testng:7.10.2'
    testImplementation 'io.qameta.allure:allure-testng:2.30.0'
    testImplementation 'org.aspectj:aspectjweaver:1.9.22'
}

test {
    useTestNG {
        suites 'src/test/resources/testng.xml'
    }

    systemProperty 'headless',
            System.getProperty('headless', 'false')

    systemProperty 'screenshot.events',
            System.getProperty('screenshot.events', 'failed,skipped')

    testLogging {
        events "passed", "skipped", "failed"
        showStandardStreams = true
    }
}

allure {
    version = '2.29.0'
}